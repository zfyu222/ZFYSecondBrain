services:
  zfy-second-brain:
    build:
      context: .
      dockerfile: prototypes/risk-lab/Dockerfile
    environment:
      TZ: ${ZFY_TIMEZONE:-Asia/Shanghai}
      ZFY_PUBLIC_ORIGIN: ${ZFY_PUBLIC_ORIGIN:?Set the public HTTPS origin, for example https://notes.example.com}
      ZFY_AUTH_PASSWORD: ${ZFY_AUTH_PASSWORD:?Set a unique single-account password}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_THINKING: ${DEEPSEEK_THINKING:-disabled}
    ports:
      - "127.0.0.1:4173:4173"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4173/api/health').then((r)=>{if(!r.ok) process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ${ZFY_DATA_DIR:?Set an absolute host directory for persistent knowledge data}:/app/prototypes/risk-lab/.prototype-data/server
    restart: unless-stopped
